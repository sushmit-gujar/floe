{{- $n := include "floe.name" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}-minio
  labels: {{- include "floe.labels" . | nindent 4 }}
spec:
  selector: {{- include "floe.selector" (dict "root" . "component" "minio") | nindent 4 }}
  ports:
    - {name: s3, port: 9000, targetPort: 9000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $n }}-minio
  labels: {{- include "floe.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ $n }}-minio
  replicas: 1
  selector:
    matchLabels: {{- include "floe.selector" (dict "root" . "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "floe.labels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: [server, /data, --address, ":9000", --console-address, ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: {{ $n }}-credentials, key: s3-access-key}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $n }}-credentials, key: s3-secret-key}}
            - {name: MINIO_BROWSER, value: "off"}
          ports:
            - {name: s3, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.minio.storage }}}}
