{{- $n := include "floe.name" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}-postgres
  labels: {{- include "floe.labels" . | nindent 4 }}
spec:
  selector: {{- include "floe.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - {name: pg, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $n }}-postgres
  labels: {{- include "floe.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $n }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "floe.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "floe.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70      # "postgres" in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_USER, value: catalog}
            - {name: POSTGRES_DB, value: catalog}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $n }}-credentials, key: postgres-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: pg, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, catalog, -d, catalog]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, catalog, -d, catalog]}
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.postgres.storage }}}}
