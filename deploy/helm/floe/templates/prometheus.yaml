{{- if .Values.prometheus.enabled }}
{{- $n := include "floe.name" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $n }}-prometheus
  labels: {{- include "floe.labels" . | nindent 4 }}
---
# Least privilege: read-only pod discovery in this namespace only (Role, not ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $n }}-prometheus
  labels: {{- include "floe.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $n }}-prometheus
  labels: {{- include "floe.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $n }}-prometheus}
subjects:
  - {kind: ServiceAccount, name: {{ $n }}-prometheus, namespace: {{ .Release.Namespace }}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $n }}-prometheus
  labels: {{- include "floe.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: floe-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [{{ .Release.Namespace }}]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}-prometheus
  labels: {{- include "floe.labels" . | nindent 4 }}
spec:
  selector: {{- include "floe.selector" (dict "root" . "component" "prometheus") | nindent 4 }}
  ports:
    - {name: http, port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}-prometheus
  labels: {{- include "floe.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "floe.selector" (dict "root" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "floe.labels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
      annotations:
        checksum/config: {{ .Values.prometheus | toJson | sha256sum | trunc 12 }}
    spec:
      serviceAccountName: {{ $n }}-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: {{ $n }}-prometheus}
        - name: data
          emptyDir: {sizeLimit: 2Gi}
{{- end }}
