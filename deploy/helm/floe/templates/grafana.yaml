{{- if .Values.grafana.enabled }}
{{- $n := include "floe.name" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $n }}-grafana-provisioning
  labels: {{- include "floe.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ $n }}-prometheus:9090
        isDefault: true
        jsonData: {timeInterval: 5s}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: floe
        folder: floe
        type: file
        options: {path: /var/lib/grafana/dashboards}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $n }}-grafana-dashboards
  labels: {{- include "floe.labels" . | nindent 4 }}
data:
  floe.json: |-
{{ .Files.Get "files/floe-dashboard.json" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}-grafana
  labels: {{- include "floe.labels" . | nindent 4 }}
spec:
  selector: {{- include "floe.selector" (dict "root" . "component" "grafana") | nindent 4 }}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}-grafana
  labels: {{- include "floe.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "floe.selector" (dict "root" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "floe.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
      annotations:
        checksum/dashboard: {{ .Files.Get "files/floe-dashboard.json" | sha256sum | trunc 12 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $n }}-credentials, key: grafana-admin-password}}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: {{ .Values.grafana.anonymousViewer | quote }}}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/floe.json}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            - {name: GF_PATHS_DATA, value: /var/lib/grafana/data}
            - {name: GF_PATHS_PLUGINS, value: /var/lib/grafana/plugins}
            # No runtime plugin downloads (read-only root fs, no egress needed): use the bundled datasources.
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
            - {name: data, mountPath: /var/lib/grafana/data}
            - {name: plugins, mountPath: /var/lib/grafana/plugins}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: provisioning
          configMap: {name: {{ $n }}-grafana-provisioning}
        - name: dashboards
          configMap: {name: {{ $n }}-grafana-dashboards}
        - {name: data, emptyDir: {}}
        - {name: plugins, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
{{- end }}
