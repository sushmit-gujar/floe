{{- /*
Credentials are generated on first install and preserved across upgrades via lookup.
Nothing secret is committed to git or set in values.
*/ -}}
{{- $name := printf "%s-credentials" (include "floe.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if $existing }}{{- $data = $existing.data -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "floe.labels" . | nindent 4 }}
type: Opaque
data:
  s3-access-key: {{ get $data "s3-access-key" | default (printf "floe%s" (randAlphaNum 12 | lower) | b64enc) }}
  s3-secret-key: {{ get $data "s3-secret-key" | default (randAlphaNum 32 | b64enc) }}
  postgres-password: {{ get $data "postgres-password" | default (randAlphaNum 24 | b64enc) }}
  lakekeeper-encryption-key: {{ get $data "lakekeeper-encryption-key" | default (randAlphaNum 32 | b64enc) }}
  grafana-admin-password: {{ get $data "grafana-admin-password" | default (randAlphaNum 20 | b64enc) }}
